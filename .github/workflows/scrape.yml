name: Scrape Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Source URL to clone'
        required: true
        type: string
      name:
        description: 'Client or site name'
        required: true
        type: string
      api:
        description: 'Search API URL'
        required: true
        type: string
      input_selector:
        description: 'Search Input Selector (CSS)'
        required: true
        type: string
      container_selector:
        description: 'Results Container Selector (CSS)'
        required: true
        type: string
      button_selector:
        description: 'Search Button Selector (CSS, optional)'
        required: false
        type: string
      mapping:
        description: 'Response mapping JSON (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        env:
          SCRAPE_URL: ${{ inputs.url }}
          SCRAPE_NAME: ${{ inputs.name }}
          SCRAPE_API: ${{ inputs.api }}
          SCRAPE_INPUT: ${{ inputs.input_selector }}
          SCRAPE_CONTAINER: ${{ inputs.container_selector }}
          SCRAPE_BUTTON: ${{ inputs.button_selector }}
          SCRAPE_MAPPING: ${{ inputs.mapping }}
        run: |
          ARGS=(--url "$SCRAPE_URL" --name "$SCRAPE_NAME" --api "$SCRAPE_API" --input "$SCRAPE_INPUT" --container "$SCRAPE_CONTAINER")
          
          if [ -n "$SCRAPE_BUTTON" ]; then
            ARGS+=(--button "$SCRAPE_BUTTON")
          fi
          
          if [ -n "$SCRAPE_MAPPING" ]; then
            ARGS+=(--mapping "$SCRAPE_MAPPING")
          fi
          
          npm run scrape -- "${ARGS[@]}"

      - name: Commit and push changes
        env:
          SCRAPE_NAME: ${{ inputs.name }}
          SCRAPE_URL: ${{ inputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/sites/
          git diff --cached --quiet || git commit -m "scrape: ${SCRAPE_NAME} from ${SCRAPE_URL}"
          git push
