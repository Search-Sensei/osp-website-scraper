name: Build and Deploy Scraper

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/osp-website-scraper" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: KeyCloakAdmin
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/osp-website-scraper:${{ github.sha }}"

            echo "==> Logging into GHCR on VM..."
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pulling latest scraper image..."
            sudo docker pull "$IMAGE"

            echo "==> Stopping existing container (if any)..."
            sudo docker rm -f osp-website-scraper 2>/dev/null || true

            echo "==> Ensuring .env file exists..."
            touch .env

            echo "==> Starting new container on port 3002..."
            sudo docker run -d \
              --name osp-website-scraper \
              --restart unless-stopped \
              -p 3002:3000 \
              --env-file .env \
              -e GITHUB_REPO_OWNER="${{ github.repository_owner }}" \
              -e GITHUB_REPO_NAME="osp-website-scraper" \
              "$IMAGE"

            echo "==> Waiting for healthcheck..."
            timeout 30s bash -c 'until curl -sf http://localhost:3002/scraper; do echo "Waiting..."; sleep 3; done'
            echo "==> osp-website-scraper deployed successfully!"

