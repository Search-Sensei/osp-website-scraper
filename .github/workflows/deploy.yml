name: Build and Deploy Scraper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/osp-website-scraper" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=v${{ github.run_number }}

      - name: Copy docker-compose and flyway to VM
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: KeyCloakAdmin
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,flyway"
          target: "/home/KeyCloakAdmin/osp-scraper"

      - name: Deploy to VM via SSH
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ secrets.PAT }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: KeyCloakAdmin
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_PAT
          script: |
            set -e
            
            # Navigate to the target directory where docker-compose.yml was copied
            cd /home/KeyCloakAdmin/osp-scraper

            # Export variables for docker-compose
            export IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/osp-website-scraper:${{ github.sha }}"
            export GITHUB_REPO_OWNER="${{ github.repository_owner }}"

            echo "==> Logging into GHCR on VM..."
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pulling latest scraper image..."
            sudo docker pull "$IMAGE"

            echo "==> Ensuring .env file exists..."
            touch .env

            echo "==> Starting containers with Docker Compose..."
            # Pass variables directly to sudo environment so docker compose picks them up
            sudo IMAGE="$IMAGE" GITHUB_PAT="$GITHUB_PAT" GITHUB_REPO_OWNER="$GITHUB_REPO_OWNER" docker-compose up -d

            echo "==> Running Flyway database migrations..."
            sudo docker run --rm --network host -v $(pwd)/flyway/sql:/flyway/sql flyway/flyway -url=jdbc:postgresql://localhost:5432/website_scraper -user=postgres -password=postgres migrate

            echo "==> Waiting for healthcheck..."
            timeout 30s bash -c 'until curl -sf http://localhost:3002/scraper; do echo "Waiting..."; sleep 3; done'
            echo "==> osp-website-scraper deployed successfully with Postgres DB!"

